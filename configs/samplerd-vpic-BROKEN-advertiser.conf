# KNOWN BROKEN — kept for reference only.
# This config uses LDMS's newer "advertiser" peer-discovery method.
# It crashes reliably with "*** buffer overflow detected ***" in our
# tested build (commit 279bd1b8b7acbf0b472d69b9eebfb3eed918e725).
# Use samplerd-static.conf + agg-static.conf instead (the prdcr_add
# method), which is confirmed working.
#
# Replace <AGGREGATOR_IP> with your aggregator instance's private IP.

advertiser_add name=agg11 xprt=sock host=<AGGREGATOR_IP> port=10444 reconnect=10s
advertiser_start name=agg11

load name=meminfo
config name=meminfo producer=${HOSTNAME} instance=${HOSTNAME}/meminfo
start name=meminfo interval=1s
